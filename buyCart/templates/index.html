<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Welcome to buyCart</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --primary-bg: #fbc2eb;
            --secondary-bg: #a6c1ee;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --text-color: #2b2d42;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, var(--primary-bg) 0%, var(--secondary-bg) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        .hero-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 24px;
            padding: 3rem 2rem;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            animation: fadeInScale 0.8s ease-out;
        }

        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .hero-title {
            color: var(--text-color);
            font-weight: 800;
            font-size: clamp(2rem, 8vw, 3.5rem);
            line-height: 1.1;
            margin-bottom: 1.5rem;
        }

        .hero-description {
            color: #4a4e69;
            font-size: 1.25rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
            font-weight: 300;
        }

        .btn-group-custom {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        @media (min-width: 576px) {
            .btn-group-custom {
                flex-direction: row;
                justify-content: center;
            }
        }

        .btn-primary-custom {
            background-color: #4361ee;
            color: white;
            padding: 0.8rem 2.5rem;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(67, 97, 238, 0.3);
        }

        .btn-primary-custom:hover {
            background-color: #3f37c9;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(67, 97, 238, 0.4);
            color: white;
        }

        .btn-outline-custom {
            background-color: transparent;
            color: #4361ee;
            padding: 0.8rem 2.5rem;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            border: 2px solid #4361ee;
            transition: all 0.3s ease;
        }

        .btn-outline-custom:hover {
            background-color: #4361ee;
            color: white;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>
    <div class="hero-card">
        <h1 class="hero-title">Welcome to buyCart</h1>
        <p class="hero-description">
            Your one-stop destination for quality products and inspiring stories. We bring you a curated variety of excellence.
        </p>
        <div class="btn-group-custom">
            <a href="/shop/" class="btn-primary-custom">Go To Shop</a>
            <a href="/blog/" class="btn-outline-custom">Go To Blog</a>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
