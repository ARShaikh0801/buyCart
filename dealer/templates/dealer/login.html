{% load static %}
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dealer Login — buyCart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{% static 'shop/css/variables.css' %}">
  <link rel="stylesheet" href="{% static 'dealer/css/dealer.css' %}">
</head>

<body>
  <div class="dealer-auth-wrapper">
    <div class="dealer-auth-card">
      <div class="auth-header">
        <div class="auth-icon">
          <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h3>Dealer Login</h3>
        <p>Sign in to your dealer dashboard</p>
      </div>

      {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show" role="alert">
          <strong>{{ message }}</strong>
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}

      <form method="post" id="dealerLoginForm">
        {% csrf_token %}

        <div class="mb-3">
          <label for="username" class="form-label fw-semibold">Username</label>
          <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" required>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label fw-semibold">Password</label>
          <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
        </div>

        <button type="submit" class="btn btn-dealer-primary mb-3">
          <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        </button>
      </form>

      <div class="text-center">
        <span class="text-muted">Don't have a dealer account?</span>
        <a href="{% url 'dealer_register' %}" class="ms-1 fw-semibold" style="color: #667eea;">Register</a>
      </div>
      <div class="text-center mt-2">
        <a href="/shop/" class="text-muted small"><i class="bi bi-arrow-left"></i> Back to Store</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
